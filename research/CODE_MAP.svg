<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1300" width="1660" height="1300" role="img" aria-labelledby="title desc"><title id="title">当前科研代码仓库框架图</title><desc id="desc">当前工作台入口下的离线训练、原生对局和已存录像播放流程。绿色是算法核心，蓝色是运行支撑，浅蓝是数据，灰色为独立历史基线。详细源码链接见同目录CODE_MAP_ZH.md。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#173147} .sub{font-size:15px;fill:#506577} .mono{font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:17px} .label{font-size:18px;font-weight:700} .arrow{fill:none;stroke:#718596;stroke-width:2.4;marker-end:url(#arrow)} a:hover rect{stroke-width:3.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718596" /></marker></defs><rect width="1660" height="1300" fill="#f8fafc" /><text x="46" y="48" font-size="30" font-weight="700">当前科研代码仓库框架图</text><text x="47" y="78" class="sub">2026-11-07 · 当前未提交代码 · 详细函数与源码导航见 CODE_MAP_ZH.md</text><rect x="1040" y="25" width="17" height="17" rx="4" fill="#e5f5e9" stroke="#29834b" /><text x="1063" y="39" font-size="15">算法核心</text><rect x="1185" y="25" width="17" height="17" rx="4" fill="#e7efff" stroke="#4777b6" /><text x="1208" y="39" font-size="15">运行支撑</text><rect x="1330" y="25" width="17" height="17" rx="4" fill="#e3f3fa" stroke="#2583a3" /><text x="1353" y="39" font-size="15">数据/文件</text><rect x="1475" y="25" width="17" height="17" rx="4" fill="#edf0f3" stroke="#8997a2" /><text x="1498" y="39" font-size="15">按需/历史</text><a href="../tools/cloud/workspace.py" target="_blank"><rect x="45" y="115" width="405" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="63" y="146" class="mono">workspace.py research</text><text x="63" y="172" class="sub">你日常执行的单一入口</text></a><a href="../tools/cloud/research_app.py" target="_blank"><rect x="515" y="115" width="535" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="533" y="146" class="mono">research_app.py + HTML</text><text x="533" y="172" class="sub">HTTP / CLI / 训练表单 / 曲线 / 原生视频播放器</text></a><a href="system.json" target="_blank"><rect x="1115" y="115" width="500" height="85" rx="12" fill="#e3f3fa" stroke="#2583a3" stroke-width="1.5" /><text x="1133" y="146" class="mono">research/system.json</text><text x="1133" y="172" class="sub">当前数据、参考模型、结果路径与默认参数</text></a><path d="M 450 157.5 H 515" class="arrow" /><a href="../royale_phase3/research.py" target="_blank"><rect x="535" y="250" width="590" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="553" y="281" class="mono">royale_phase3/research.py</text><text x="553" y="307" class="sub">ResearchService：校验 → 串行队列 → 子进程 → 保存证据</text></a><path d="M 782.5 200 V 225.0 H 830.0 V 250" class="arrow" /><path d="M 1365 200 V 230 H 1127 V 291" class="arrow" /><rect x="45" y="382" width="500" height="686" rx="16" fill="#ffffff" stroke="#dce3ea" /><text x="65" y="414" class="label">离线训练</text><text x="65" y="440" class="sub">offline / full · 不启动 Android</text><rect x="580" y="382" width="500" height="686" rx="16" fill="#ffffff" stroke="#dce3ea" /><text x="600" y="414" class="label">原生新局</text><text x="600" y="440" class="sub">evaluate / full · 单世界控制</text><rect x="1115" y="382" width="500" height="686" rx="16" fill="#ffffff" stroke="#dce3ea" /><text x="1135" y="414" class="label">真实录像与回看</text><text x="1135" y="440" class="sub">评估时录制 · 回看只读取文件</text><a href="../royale_phase3/data_contract.py" target="_blank"><rect x="70" y="466" width="450" height="85" rx="12" fill="#e3f3fa" stroke="#2583a3" stroke-width="1.5" /><text x="88" y="497" class="mono">data_contract.py + native_loop.py</text><text x="88" y="523" class="sub">读取 metadata/rows；整局切分；物理剥离 test</text></a><a href="../royale_phase3/learning.py" target="_blank"><rect x="70" y="582" width="450" height="85" rx="12" fill="#e5f5e9" stroke="#29834b" stroke-width="1.5" /><text x="88" y="613" class="mono">learning.py  SmallPolicy / loss</text><text x="88" y="639" class="sub">713 维输入 → 编码 → GRU → 动作头与位置头</text></a><a href="models/gru-c/reference.json" target="_blank"><rect x="70" y="698" width="450" height="85" rx="12" fill="#e3f3fa" stroke="#2583a3" stroke-width="1.5" /><text x="88" y="729" class="mono">checkpoint JSON + NPZ</text><text x="88" y="755" class="sub">保存架构、权重、数据与版本指纹</text></a><a href="../tools/cloud/research_worker.py" target="_blank"><rect x="70" y="814" width="450" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="88" y="845" class="mono">research_worker.py validate</text><text x="88" y="871" class="sub">独立进程加载；共用部署 decoder</text></a><a href="runs/" target="_blank"><rect x="70" y="930" width="450" height="85" rx="12" fill="#e3f3fa" stroke="#2583a3" stroke-width="1.5" /><text x="88" y="961" class="mono">research/runs/&lt;run_id&gt;/</text><text x="88" y="987" class="sub">模型、曲线、validation、配置、日志</text></a><a href="../tools/cloud/research_runtime.py" target="_blank"><rect x="605" y="466" width="450" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="623" y="497" class="mono">research_runtime.py</text><text x="623" y="523" class="sub">核验/复用现有 VM、准备显式连接</text></a><a href="../royale_phase3/native_loop.py" target="_blank"><rect x="605" y="582" width="450" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="623" y="613" class="mono">native_loop.py  run_batch</text><text x="623" y="639" class="sub">换边、预算、逐局执行、附着 recorder</text></a><a href="../royale_phase3/native_env.py" target="_blank"><rect x="605" y="698" width="450" height="85" rx="12" fill="#e5f5e9" stroke="#29834b" stroke-width="1.5" /><text x="623" y="729" class="mono">native_env.py + StatefulPolicy</text><text x="623" y="755" class="sub">观测/历史/belief → 模型 → 动作 → 反馈</text></a><a href="../royale_phase2/backend.py" target="_blank"><rect x="605" y="814" width="450" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="623" y="845" class="mono">royale_phase2/backend.py</text><text x="623" y="871" class="sub">建局、tick、卡牌调度、实际消费确认</text></a><a href="../royale_phase2/probe.py" target="_blank"><rect x="605" y="930" width="450" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="623" y="961" class="mono">ProbeClient → Android 原生游戏</text><text x="623" y="987" class="sub">TCP JSON → libcrprobe.so → 固定 libg.so</text></a><a href="../tools/cloud/native_frame_media.py" target="_blank"><rect x="1140" y="466" width="450" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="1158" y="497" class="mono">native_frame_media.py</text><text x="1158" y="523" class="sub">在 reset 之前启动原生帧录制</text></a><a href="../tools/cloud/native_frame_media.py" target="_blank"><rect x="1140" y="582" width="450" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="1158" y="613" class="label">同一 Android 的 FrameOutput</text><text x="1158" y="639" class="sub">ADB 连续 RGB 帧；不是网页重画</text></a><a href="../tools/cloud/native_media.py" target="_blank"><rect x="1140" y="698" width="450" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="1158" y="729" class="mono">FFmpeg → VP9 / WebM</text><text x="1158" y="755" class="sub">有界队列、时间锚点、解码与覆盖检查</text></a><a href="media/native-initialization.json" target="_blank"><rect x="1140" y="814" width="450" height="85" rx="12" fill="#e3f3fa" stroke="#2583a3" stroke-width="1.5" /><text x="1158" y="845" class="mono">native.webm + recording.json</text><text x="1158" y="871" class="sub">标记 complete / partial；保留缺失与误差</text></a><a href="../tools/cloud/research_app.py" target="_blank"><rect x="1140" y="930" width="450" height="85" rx="12" fill="#e7efff" stroke="#4777b6" stroke-width="1.5" /><text x="1158" y="961" class="mono">research_app.py  HTTP Range</text><text x="1158" y="987" class="sub">HTML video 播放/暂停/倍速/seek；无需 VM</text></a><path d="M 295.0 551 V 566.5 H 295.0 V 582" class="arrow" /><path d="M 295.0 667 V 682.5 H 295.0 V 698" class="arrow" /><path d="M 295.0 783 V 798.5 H 295.0 V 814" class="arrow" /><path d="M 295.0 899 V 914.5 H 295.0 V 930" class="arrow" /><path d="M 830.0 551 V 566.5 H 830.0 V 582" class="arrow" /><path d="M 830.0 667 V 682.5 H 830.0 V 698" class="arrow" /><path d="M 830.0 783 V 798.5 H 830.0 V 814" class="arrow" /><path d="M 830.0 899 V 914.5 H 830.0 V 930" class="arrow" /><path d="M 1365.0 551 V 566.5 H 1365.0 V 582" class="arrow" /><path d="M 1365.0 667 V 682.5 H 1365.0 V 698" class="arrow" /><path d="M 1365.0 783 V 798.5 H 1365.0 V 814" class="arrow" /><path d="M 1365.0 899 V 914.5 H 1365.0 V 930" class="arrow" /><path d="M 830.0 335 V 400.5 H 295.0 V 466" class="arrow" /><text x="348" y="389" class="sub">训练子进程</text><path d="M 830.0 335 V 400.5 H 830.0 V 466" class="arrow" /><text x="843" y="368" class="sub">仅原生模式</text><path d="M 1055 604 H 1100 V 490 H 1140" class="arrow" stroke-dasharray="7 5" /><text x="1086" y="576" class="sub" transform="rotate(-90 1086 576)">预选局录制</text><a href="../royale_lab/learning.py" target="_blank"><rect x="45" y="1100" width="500" height="83" rx="12" fill="#edf0f3" stroke="#8997a2" stroke-width="1.5" /><text x="63" y="1131" class="mono">royale_ai / royale_lab / baseline</text><text x="63" y="1157" class="sub">独立近似基线与冻结历史；当前研究可先不读</text></a><a href="../royale_phase3/world.py" target="_blank"><rect x="580" y="1100" width="500" height="83" rx="12" fill="#fff0dc" stroke="#c47b29" stroke-width="1.5" /><text x="598" y="1131" class="mono">world.py / sources.py / 扩展 CLI</text><text x="598" y="1157" class="sub">按研究问题启用；当前 C 不含世界模型闭环</text></a><a href="CODE_MAP_ZH.md" target="_blank"><rect x="1115" y="1100" width="500" height="83" rx="12" fill="#edf0f3" stroke="#8997a2" stroke-width="1.5" /><text x="1133" y="1131" class="mono">tests_* / docs / 固定资产</text><text x="1133" y="1157" class="sub">契约与证据支撑；非每次对局执行的步骤</text></a><text x="48" y="1220" font-size="18" font-weight="700">当前边界：离线训练与独立验证已通过；原生评估预热超时；可看真实初始化片段；完整录像与连续人机尚未交付。</text><text x="48" y="1253" class="sub">phase2 协议模块和 native_media.py 仍被当前主链复用。未进入默认流程 ≠ 无用或可删除；图下源码导航详见 CODE_MAP_ZH.md。</text></svg>