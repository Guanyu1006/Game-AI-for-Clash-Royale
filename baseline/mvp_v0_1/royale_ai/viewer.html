<!DOCTYPE html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royale AI · 对局回放</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101820;color:#ebf2f4}*{box-sizing:border-box}body{margin:0;padding:28px}header{max-width:1100px;margin:auto}h1{font-size:26px;margin:0 0 10px}.sub{color:#95aab5;font-size:14px}.layout{display:grid;grid-template-columns:minmax(280px,440px) minmax(280px,1fr);gap:24px;max-width:1100px;margin:24px auto}.card{background:#1b2834;border:1px solid #304351;border-radius:16px;padding:20px}canvas{width:100%;display:block;background:#24463d;border-radius:10px}button,input{accent-color:#6dd8c3}button{border:0;border-radius:8px;padding:10px 18px;background:#6dd8c3;color:#132a2c;font-weight:700;cursor:pointer}.controls{display:flex;gap:14px;align-items:center;margin-top:18px}input{width:100%}.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat div{background:#12202a;padding:14px;border-radius:10px}.stat small{display:block;color:#95aab5;margin-bottom:5px}.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.hand span{font-size:12px;border:1px solid #476171;padding:12px 4px;text-align:center;border-radius:8px;overflow-wrap:anywhere}.chosen{background:#255c54;border-color:#6dd8c3!important}h2{font-size:17px;margin-top:24px}p{line-height:1.6;color:#c9d7df}.candidate{display:flex;justify-content:space-between;font-size:13px;padding:10px 0;border-bottom:1px solid #304351}.legend{font-size:12px;color:#a5b7c0;margin-top:14px}.blue{color:#75b9ff}.red{color:#ff9696}@media(max-width:720px){body{padding:15px}.layout{grid-template-columns:1fr}}
</style>
<header><h1>Royale AI / 战术回放</h1><div class="sub">MVP 简化模拟器 · 观察 → 信念 → 合法候选 → 短时前瞻 · 此页面离线运行</div></header>
<main class="layout"><section class="card"><canvas id="arena" width="432" height="768"></canvas><div class="controls"><button id="play">播放</button><input id="slider" type="range" min="0" value="0"><span id="frame"></span></div><div class="legend"><span class="blue">● 我方</span>　<span class="red">● 对手</span>　圈标记当前决策落点；血条为模拟值</div></section>
<section class="card"><div class="stat"><div><small>对局时间</small><strong id="clock"></strong></div><div><small>我方圣水</small><strong id="elixir"></strong></div><div><small>对手圣水区间</small><strong id="enemy"></strong></div><div><small>搜索耗时</small><strong id="latency"></strong></div></div><div class="hand" id="hand"></div><h2>当前判断</h2><p id="reason"></p><h2>候选排名</h2><div id="rankings"></div><h2>已见对手卡牌</h2><p id="seen"></p><p class="sub">评分只在当前候选、有限时间窗口和近似模型内比较。真实游戏的视觉误差、卡牌机制与长期策略仍需验证。</p></section></main>
<script id="data" type="application/json">__REPLAY_DATA__</script>
<script>
const all=JSON.parse(document.getElementById('data').textContent),rows=all.filter(r=>r.observation),$=s=>document.getElementById(s),ctx=$('arena').getContext('2d');let index=0,timer=null;const names={giant:'巨人',knight:'骑士',archers:'弓箭手',minions:'亡灵',musketeer:'火枪手',mini_pekka:'迷你皮卡',arrows:'万箭齐发',fireball:'火球',hog_rider:'野猪骑士',cannon:'加农炮',skeletons:'骷髅兵',valkyrie:'女武神'};function name(c){return names[c]||c||'等待'}
$('slider').max=Math.max(0,rows.length-1);function draw(){if(!rows.length)return;const r=rows[index],o=r.observation,d=r.decision||{},a=d.action||{slot:-1};ctx.clearRect(0,0,432,768);ctx.fillStyle='#23463e';ctx.fillRect(0,0,432,768);ctx.strokeStyle='#315a4f';for(let x=0;x<=432;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,768);ctx.stroke()}for(let y=0;y<=768;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(432,y);ctx.stroke()}ctx.fillStyle='#255a73';ctx.fillRect(0,374,432,20);ctx.fillStyle='#b6a070';ctx.fillRect(72,368,48,32);ctx.fillRect(312,368,48,32);for(const t of o.towers){const x=t.x*24,y=t.y*24;ctx.fillStyle=t.hp<=0?'#4a5355':t.team===0?'#559cd9':'#d97373';ctx.fillRect(x-20,y-20,40,40);ctx.fillStyle='#07131b';ctx.fillRect(x-23,y-30,46,5);ctx.fillStyle=t.team===0?'#79caff':'#ffa1a1';ctx.fillRect(x-23,y-30,46*t.hp/t.max_hp,5);ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(Math.round(t.hp),x,y+4);if(t.king)ctx.fillText('K',x,y+16)}for(const u of o.units){let x=u.x*24,y=u.y*24;ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fillStyle=u.team===0?'#81c4ff':'#ff9696';ctx.fill();ctx.fillStyle='#edf7f9';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(name(u.card),x,y-14)}if(a.slot>=0){ctx.strokeStyle='#f8df91';ctx.lineWidth=3;ctx.beginPath();ctx.arc(a.x*24,a.y*24,17,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1}$('clock').textContent=o.time.toFixed(1)+' s';$('elixir').textContent=o.elixir.toFixed(2);$('enemy').textContent=(d.belief?.elixir_interval||['?','?']).join(' — ');$('latency').textContent=(d.elapsed_ms||0).toFixed(1)+' ms';$('reason').textContent=d.reason||'对局结束';$('hand').replaceChildren(...o.hand.map((c,i)=>{const n=document.createElement('span');n.textContent=name(c);if(i===a.slot)n.className='chosen';return n}));$('rankings').replaceChildren(...(d.rankings||[]).map(c=>{const n=document.createElement('div');n.className='candidate';const label=document.createElement('span'),score=document.createElement('span');label.textContent=name(c.card)+(c.card?' @ '+c.action.x+', '+c.action.y:'');score.textContent=c.score.toFixed(3);n.append(label,score);return n}));$('seen').textContent=(d.belief?.observed_cards||[]).map(name).join('、')||'尚未观察到出牌';$('frame').textContent=(index+1)+'/'+rows.length;$('slider').value=index}
$('slider').oninput=()=>{index=+$('slider').value;draw()};$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='播放'}else{$('play').textContent='暂停';timer=setInterval(()=>{index=(index+1)%rows.length;draw()},350)}};draw();
</script></html>
